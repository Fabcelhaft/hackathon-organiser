<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Register')}">
    <title>Register</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: layout(title='Register', content=~{::#content})}">
<div id="content">
    <!--/* FR-010: with maxRegistrations reached, the capacity message replaces the form entirely —
         on both a fresh GET and a POST re-render, neither of which carries a `flash` redirect, so
         it gets its own role="status" treatment for consistency with the layout's flash banner. */-->
    <p th:if="${atCapacity}" role="status">Maximum registrations reached.</p>

    <!--/* Feature 008 FR-016/FR-016b: the USER_REGISTRATION-designated page's body only — no title,
         no card — flowing directly above the form. MarkdownRenderer keeps its headings at <h2>+,
         so the layout's <h1>Register</h1> stays the page's single top-level heading (FR-016c).
         th:utext is deliberate: bodyHtml is pre-sanitized by MarkdownRenderer (003 research.md §1). */-->
    <div th:if="${designatedContent} != null" id="designated-content" th:utext="${designatedContent.bodyHtml()}">Body</div>

    <form th:unless="${atCapacity}" th:action="@{/register}" method="post" id="register-form">
        <p th:if="${error}" th:text="${error}" role="alert" class="error-message">Error</p>

        <div th:replace="~{fragments/profile-fields-form :: fields}"></div>

        <button type="submit" id="register-submit">Register</button>
    </form>

    <!--/* FR-036: submit control disabled for the duration of submission. */-->
    <script th:unless="${atCapacity}">
        (function () {
            var form = document.getElementById('register-form');
            var submitButton = document.getElementById('register-submit');
            if (!form || !submitButton) {
                return;
            }
            form.addEventListener('submit', function () {
                submitButton.disabled = true;
            });
        })();
    </script>
</div>
</th:block>
<script th:unless="${atCapacity}" th:src="@{/js/country-select.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Topics')}">
    <title>Topics</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: layout(title='Topics', content=~{::#content})}">
    <div id="content">
        <!--/* FR-034: the viewer's own Topics are pinned above the rest; this route is uncapped, so
             pinning only reorders — every row from `rows` still appears in exactly one of the two
             tables below. */-->
        <div th:if="${!#lists.isEmpty(rows.?[pinned])}">
            <h2 id="your-topics-heading">Your Topics</h2>
            <table aria-labelledby="your-topics-heading">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Author</th>
                    <th>Participants</th>
                    <th>Needed Skills</th>
                    <th th:if="${complianceVisible}">Compliance</th>
                    <th th:if="${upvotingEnabled}">Upvotes</th>
                    <th th:if="${canJoinTopics}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows.?[pinned]}">
                    <!--/* Feature 013 (FR-001, FR-004): the name is the link; the badge sits beside it,
                         outside the link target. The name wraps rather than widening the table
                         past the viewport, which would push the right-hand columns out of sight. */-->
                    <td>
                        <span class="name-with-badge">
                            <a th:href="@{/topics/{id}(id=${row.topic().id})}"
                               th:text="${row.topic().name}">Name</a>
                            <span th:if="${row.topic().referenceNumber} != null" class="badge badge-sm"
                                  th:text="'#' + ${row.topic().referenceNumber}">#1</span>
                        </span>
                    </td>
                    <td th:text="${row.authorDisplayName()}">Author</td>
                    <td th:text="${row.memberCount()}">0</td>
                    <td>
                        <span th:each="skill, iter : ${row.neededSkills()}">
                            <span th:text="${skill.name}">Skill</span><span th:unless="${iter.last}">, </span>
                        </span>
                    </td>
                    <td th:if="${complianceVisible}">
                        <!--/* FR-014a: a blank cell when no Group yet, not a "No Group Yet" label.
                             FR-025: text/icon, never color alone, for every non-blank state. The
                             icon carries its meaning via aria-label rather than a visible text
                             sibling; COMPLIANT and COMPLIANT_OVERRIDE render identically here since
                             whether compliance was reached naturally or via Organiser override is
                             organiser-space-only information (see organiser/groups/detail.html). */-->
                        <span th:if="${row.complianceStatus().isPresent()} and (${row.complianceStatus().get().name()} == 'COMPLIANT' or ${row.complianceStatus().get().name()} == 'COMPLIANT_OVERRIDE')" class="badge-success">
                            <svg th:replace="~{fragments/icons :: checkCircle('Compliant')}"/>
                        </span>
                        <span th:if="${row.complianceStatus().isPresent()} and ${row.complianceStatus().get().name()} == 'NOT_COMPLIANT'" class="badge-danger">
                            <svg th:replace="~{fragments/icons :: xCircle('Not Compliant')}"/>
                        </span>
                    </td>
                    <!--/* Feature 013 (FR-005): count and action collapse into one compact control,
                         rendered from the single shared fragment so the two screens cannot drift. */-->
                    <td class="actions actions-nowrap vote-cell" th:if="${upvotingEnabled}">
                        <th:block th:replace="~{fragments/topic-vote :: control(
                            topicId=${row.topic().id},
                            topicName=${row.topic().name},
                            upvoteCount=${row.upvoteCount()},
                            viewerHasUpvoted=${row.viewerHasUpvoted()},
                            redirect='/topics/overview')}"/>
                    </td>
                    <td class="actions actions-nowrap" th:if="${canJoinTopics}">
                        <form th:if="${row.joinable()}" th:action="@{/topics/{id}/join(id=${row.topic().id})}" method="post">
                        <input type="hidden" name="redirect" value="/topics/overview"/>
                            <!--/* FR-011a: name the screen we are on, so joining returns here instead
                                 of always bouncing to the Home Page. Validated server-side against
                                 an allow-list (SelfServiceRedirects), so a tampered value cannot
                                 turn joining into an open redirect (FR-011b). */-->
                            <input type="hidden" name="redirect" value="/topics/overview"/>
                            <button type="submit" class="join-control outline secondary">Join</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <h2 id="all-topics-heading">All Topics</h2>
        <table aria-labelledby="all-topics-heading">
            <thead>
            <tr>
                <th>Name</th>
                <th>Author</th>
                <th>Participants</th>
                <th>Needed Skills</th>
                <th th:if="${complianceVisible}">Compliance</th>
                <th th:if="${upvotingEnabled}">Upvotes</th>
                <th th:if="${canJoinTopics}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${rows.?[!pinned]}">
                <td>
                    <span class="name-with-badge">
                        <a th:href="@{/topics/{id}(id=${row.topic().id})}"
                           th:text="${row.topic().name}">Name</a>
                        <span th:if="${row.topic().referenceNumber} != null" class="badge badge-sm"
                              th:text="'#' + ${row.topic().referenceNumber}">#1</span>
                    </span>
                </td>
                <td th:text="${row.authorDisplayName()}">Author</td>
                <td th:text="${row.memberCount()}">0</td>
                <td>
                    <span th:each="skill, iter : ${row.neededSkills()}">
                        <span th:text="${skill.name}">Skill</span><span th:unless="${iter.last}">, </span>
                    </span>
                </td>
                <td th:if="${complianceVisible}">
                    <!--/* FR-014a: a blank cell when no Group yet, not a "No Group Yet" label.
                         FR-025: text/icon, never color alone, for every non-blank state. The icon
                         carries its meaning via aria-label rather than a visible text sibling;
                         COMPLIANT and COMPLIANT_OVERRIDE render identically here since whether
                         compliance was reached naturally or via Organiser override is
                         organiser-space-only information (see organiser/groups/detail.html). */-->
                    <span th:if="${row.complianceStatus().isPresent()} and (${row.complianceStatus().get().name()} == 'COMPLIANT' or ${row.complianceStatus().get().name()} == 'COMPLIANT_OVERRIDE')" class="badge-success">
                        <svg th:replace="~{fragments/icons :: checkCircle('Compliant')}"/>
                    </span>
                    <span th:if="${row.complianceStatus().isPresent()} and ${row.complianceStatus().get().name()} == 'NOT_COMPLIANT'" class="badge-danger">
                        <svg th:replace="~{fragments/icons :: xCircle('Not Compliant')}"/>
                    </span>
                </td>
                <td class="actions actions-nowrap vote-cell" th:if="${upvotingEnabled}">
                    <th:block th:replace="~{fragments/topic-vote :: control(
                        topicId=${row.topic().id},
                        topicName=${row.topic().name},
                        upvoteCount=${row.upvoteCount()},
                        viewerHasUpvoted=${row.viewerHasUpvoted()},
                        redirect='/topics/overview')}"/>
                </td>
                <td class="actions actions-nowrap" th:if="${canJoinTopics}">
                    <form th:if="${row.joinable()}" th:action="@{/topics/{id}/join(id=${row.topic().id})}" method="post">
                        <button type="submit" class="join-control outline secondary">Join</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${rows.isEmpty()}">
                <td th:attr="colspan=${4 + (complianceVisible ? 1 : 0) + (upvotingEnabled ? 1 : 0) + (canJoinTopics ? 1 : 0)}">No Topics to show yet.</td>
            </tr>
            </tbody>
        </table>
        <!--/* FR-008b: one polite live region per screen (see home/index.html). */-->
        <th:block th:if="${upvotingEnabled}">
            <!--/* The th:if MUST sit on a separate, outer element. Thymeleaf processes fragment
                 inclusion (th:replace, precedence 100) BEFORE conditionals (th:if, precedence 300), so
                 putting both on one element silently ignores the condition and the region renders even
                 with upvoting switched off. */-->
            <th:block th:replace="~{fragments/topic-vote :: liveRegion}"/>
        </th:block>
    </div>
</th:block>
<!--/* Feature 013 (FR-006a): the in-place vote enhancement. This tag MUST stay outside the
     </th:block> above — a <script> placed inside the layout fragment block is discarded by
     Thymeleaf, and the failure is silent: the page renders perfectly and the enhancement simply
     never runs (research.md §8.1). The existing revoke-dialog script below sits here for the same
     reason. */-->
<script th:if="${upvotingEnabled}" th:src="@{/js/topic-vote.js}" defer></script>
</body>
</html>

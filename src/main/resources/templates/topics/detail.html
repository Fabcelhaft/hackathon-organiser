<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/* The Topic's name is the <h1> the layout renders, so the page has one heading carrying its
     subject rather than a generic "Topic Details" above a repeated name. */-->
<head th:replace="~{fragments/layout :: head(title=${detail.topic.name})}">
    <title>Topic Details</title>
</head>
<body>
<th:block th:replace="~{fragments/layout :: layout(title=${detail.topic.name}, content=~{::#content})}">
    <div id="content">
        <!--/* Feature 010 FR-001a: the description is markdown, rendered full-width directly under
             the page heading rather than squeezed into a Topic Info cell, so headings, lists and
             images have room. th:utext is deliberate: descriptionHtml is pre-sanitized by
             MarkdownRenderer, the single point in this codebase that emits unescaped HTML. Its
             heading shift keeps author headings at <h2>+, so the layout's <h1> stays the only
             top-level heading (FR-005). */-->
        <section class="topic-description" th:utext="${descriptionHtml}">Description</section>

        <div class="actions" th:if="${detail.author} or ${detail.isMember()}">
            <a th:if="${detail.author}" th:href="@{/topics/{id}/edit(id=${detail.topic.id})}"
               role="button">Edit this Topic</a>
            <form th:if="${detail.isMember()}" th:action="@{/topics/{id}/leave(id=${detail.topic.id})}" method="post">
                <button type="submit" class="outline danger" aria-label="Leave this Topic">Leave</button>
            </form>
        </div>

        <table>
            <caption>Topic Info</caption>
            <tbody>
                <!--/* Feature 010 FR-001a: the Description row moved out of this table into the
                     rendered section above, so the description is shown exactly once. */-->
                <tr>
                    <th scope="row">Needed Skills</th>
                    <td>
                        <span th:if="${detail.neededSkills.isEmpty()}">None</span>
                        <span th:each="skill, iter : ${detail.neededSkills}">
                            <span th:text="${skill.name}">Skill</span><span th:unless="${iter.last}">, </span>
                        </span>
                    </td>
                </tr>
                <tr>
                    <th scope="row">Participants</th>
                    <td th:text="${detail.memberCount}">0</td>
                </tr>
                <tr th:if="${complianceVisible}">
                    <th scope="row">Compliance</th>
                    <td>
                        <!--/* FR-014a: a blank cell when no Group yet, not a "No Group Yet" label. FR-025:
                             text/icon, never color alone, for every non-blank state. The icon carries its
                             meaning via aria-label rather than a visible text sibling; COMPLIANT and
                             COMPLIANT_OVERRIDE render identically here since whether compliance was reached
                             naturally or via Organiser override is organiser-space-only information (see
                             organiser/groups/detail.html). */-->
                        <span th:if="${detail.complianceStatus().isPresent()} and (${detail.complianceStatus().get().name()} == 'COMPLIANT' or ${detail.complianceStatus().get().name()} == 'COMPLIANT_OVERRIDE')" class="badge-success">
                            <svg th:replace="~{fragments/icons :: checkCircle('Compliant')}"/>
                        </span>
                        <span th:if="${detail.complianceStatus().isPresent()} and ${detail.complianceStatus().get().name()} == 'NOT_COMPLIANT'" class="badge-danger">
                            <svg th:replace="~{fragments/icons :: xCircle('Not Compliant')}"/>
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>

        <!--/* Feature 010 FR-018: between Topic Info and Joined Participants, visible to everyone
             who can see this Topic. Management lives on the edit screen, since this view is
             read-only by design (feature 005 Story 9). The empty state is stated rather than the
             whole section disappearing. */-->
        <h2>Attachments</h2>
        <p th:if="${attachments == null or attachments.isEmpty()}">No attachments yet.</p>
        <!--/* No <caption> here: the <h2> immediately above already names this
             table, and repeating the word twice reads as a duplicated heading. */-->
        <table th:unless="${attachments == null or attachments.isEmpty()}">
            <thead>
            <tr>
                <th scope="col">File</th>
                <th scope="col">Size</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="attachment : ${attachments}">
                <td>
                    <a th:href="@{/topics/{tid}/attachments/{aid}(tid=${attachment.topicId()},aid=${attachment.id()})}"
                       th:text="${attachment.fileName()}">file.pdf</a>
                </td>
                <td th:text="${attachment.humanSize()}">1.2 MB</td>
            </tr>
            </tbody>
        </table>

        <h2>Who's Joined</h2>
        <p th:if="${detail.members.isEmpty()}">No one has joined yet.</p>
        <table th:unless="${detail.members.isEmpty()}">
            <caption>Joined Participants</caption>
            <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Fields</th>
                    <th scope="col">Skills</th>
                </tr>
            </thead>
            <!--/* FR-031, FR-036: each member's own visible fields/Skills (already filtered for this
                 viewer by ParticipantService#findDetailForViewer) — the word "Group" never appears
                 here or anywhere else on this page. */-->
            <tbody>
                <tr th:each="member : ${detail.members}">
                    <td><span th:replace="~{fragments/teams-link :: displayName(${member.userDisplayName}, ${teamsLinksEnabled ? member.userEmail : null})}"></span></td>
                    <td>
                        <ul th:unless="${member.fields.isEmpty()}">
                            <li th:each="cfv : ${member.fields}">
                                <span th:text="${cfv.definition.label} + ': '">Label:</span>
                                <span th:if="${cfv.definition.fieldType.name()} == 'FREE_TEXT'"
                                      th:text="${cfv.freeTextValue}">Value</span>
                                <span th:if="${cfv.definition.fieldType.name()} == 'COUNTRY'"
                                      th:text="${cfv.freeTextValue}">Country</span>
                                <span th:if="${cfv.definition.fieldType.name()} == 'SINGLE_SELECT' or ${cfv.definition.fieldType.name()} == 'MULTI_SELECT'">
                                    <span th:each="option : ${cfv.options}" th:if="${#lists.contains(cfv.selectedOptionIds, option.id)}"
                                          th:text="${option.label}">Option</span>
                                </span>
                            </li>
                        </ul>
                    </td>
                    <td>
                        <span th:if="${!member.skills.isEmpty()}" th:each="skill, iter : ${member.skills}">
                            <span th:text="${skill.name}">Skill</span><span th:unless="${iter.last}">, </span>
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</th:block>
</body>
</html>

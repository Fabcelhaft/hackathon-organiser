<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{organiser/fragments/layout :: head(title='Content Pages')}">
    <title>Content Pages</title>
</head>
<body>
<th:block th:replace="~{organiser/fragments/layout :: layout(title='Content Pages', content=~{::#content})}">
    <div id="content">
        <p th:if="${error}" th:text="${error}" role="alert" class="error-message">Error</p>
        <div class="actions"><a th:href="@{/organiser/content-pages/new}" role="button">New Content Page</a></div>
        <table>
            <thead>
            <tr>
                <th>Title</th>
                <th>Sort Index</th>
                <th>Designation</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="page : ${pages}">
                <td th:text="${page.title}">Title</td>
                <td th:text="${page.sortIndex}">0</td>
                <!--/* Feature 008 FR-018: the context this page is designated for, or a dash. */-->
                <td th:text="${page.context.name() == 'NONE'} ? '—' : ${page.context.displayName}">—</td>
                <td class="actions">
                    <a th:href="@{/organiser/content-pages/{id}/edit(id=${page.id})}" role="button"
                       class="outline secondary">Edit</a>
                    <form th:action="@{/organiser/content-pages/{id}/delete(id=${page.id})}" method="post">
                        <!--/* Feature 008 FR-018a: only a designated page's Delete carries the
                             confirmation (data-confirm, wired below); an undesignated page's button
                             renders exactly as before, with no added attribute or step. */-->
                        <button type="submit" class="outline danger"
                                th:data-confirm="${page.context.name() == 'NONE'} ? null : |This page is designated for: ${page.context.displayName}. Deleting it leaves that screen without its content. Delete anyway?|">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
<!--/* Feature 008 FR-018a (research.md §9): the native confirm() dialog, attached only to buttons
     that carry a data-confirm message — no client-side framework, no modal component. */-->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var buttons = document.querySelectorAll('button[data-confirm]');
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener('click', function (event) {
                if (!window.confirm(event.currentTarget.getAttribute('data-confirm'))) {
                    event.preventDefault();
                }
            });
        }
    });
</script>
</body>
</html>

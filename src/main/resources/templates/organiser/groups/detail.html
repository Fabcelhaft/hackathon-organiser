<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{organiser/fragments/layout :: head(title='Group Detail')}">
    <title>Group Detail</title>
</head>
<body>
<th:block th:replace="~{organiser/fragments/layout :: layout(title='Group Detail', content=~{::#content})}">
    <div id="content">
        <p th:if="${error}" th:text="${error}" role="alert" class="error-message">Error</p>

        <dl>
            <dt>Topic</dt>
            <dd th:text="${detail.topicName}">Topic</dd>
            <dt>Status</dt>
            <dd th:text="${detail.group.status}">Status</dd>
            <dt>Compliance</dt>
            <dd>
                <!--/* FR-025: text/icon, never color alone. */-->
                <span th:if="${complianceStatus} == null">
                    <svg th:replace="~{fragments/icons :: circleHelp(null)}"/> No Group Yet
                </span>
                <span th:if="${complianceStatus} != null and ${complianceStatus.name()} == 'COMPLIANT'" class="badge-success">
                    <svg th:replace="~{fragments/icons :: checkCircle(null)}"/> Compliant
                </span>
                <span th:if="${complianceStatus} != null and ${complianceStatus.name()} == 'NOT_COMPLIANT'" class="badge-danger">
                    <svg th:replace="~{fragments/icons :: xCircle(null)}"/> Not Compliant
                </span>
                <span th:if="${complianceStatus} != null and ${complianceStatus.name()} == 'COMPLIANT_OVERRIDE'" class="badge-success">
                    <svg th:replace="~{fragments/icons :: checkCircle(null)}"/> Compliant (Organiser Override)
                </span>
            </dd>
        </dl>

        <div class="actions">
            <form th:if="${detail.group.complianceOverride}"
                  th:action="@{/organiser/groups/{id}/compliance-override(id=${detail.group.id})}" method="post">
                <input type="hidden" name="override" value="false"/>
                <button type="submit" class="outline secondary">Remove Compliance Override</button>
            </form>
            <form th:unless="${detail.group.complianceOverride}"
                  th:action="@{/organiser/groups/{id}/compliance-override(id=${detail.group.id})}" method="post">
                <input type="hidden" name="override" value="true"/>
                <button type="submit" class="outline secondary">Mark Compliant (Override)</button>
            </form>
        </div>

        <h2>Current Members</h2>
        <table>
            <thead>
            <tr>
                <th>Participant</th>
                <th>Joined</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${detail.currentMembers}">
                <td th:text="${m.participantDisplayName}">Name</td>
                <td th:text="${m.joinedAt}">Joined</td>
                <td class="actions">
                    <form th:if="${detail.group.status.name()} == 'ACTIVE'"
                          th:action="@{/organiser/groups/{id}/members/{pid}/remove(id=${detail.group.id}, pid=${m.participantId})}"
                          method="post">
                        <button type="submit" class="outline danger">Remove</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${detail.currentMembers.isEmpty()}">
                <td colspan="3">None</td>
            </tr>
            </tbody>
        </table>

        <h2>Former Members</h2>
        <table>
            <thead>
            <tr>
                <th>Participant</th>
                <th>Joined</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${detail.formerMembers}">
                <td th:text="${m.participantDisplayName}">Name</td>
                <td th:text="${m.joinedAt}">Joined</td>
            </tr>
            <tr th:if="${detail.formerMembers.isEmpty()}">
                <td colspan="2">None</td>
            </tr>
            </tbody>
        </table>

        <div th:if="${detail.group.status.name()} == 'ACTIVE'">
            <h2>Add Member</h2>
            <form th:action="@{/organiser/groups/{id}/members(id=${detail.group.id})}" method="post">
                <label for="participant_id">Participant</label>
                <select id="participant_id" name="participant_id" required="required">
                    <option th:each="p : ${allParticipants}" th:value="${p.id}" th:text="${p.displayName}">
                        Name
                    </option>
                </select>
                <button type="submit">Add</button>
            </form>

            <h2>Disband</h2>
            <div class="actions">
                <form th:action="@{/organiser/groups/{id}/disband(id=${detail.group.id})}" method="post">
                    <button type="submit" class="outline danger">Disband</button>
                </form>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>

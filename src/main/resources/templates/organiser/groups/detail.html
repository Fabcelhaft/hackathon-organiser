<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{organiser/fragments/layout :: head(title='Group Detail')}">
    <title>Group Detail</title>
</head>
<body>
<th:block th:replace="~{organiser/fragments/layout :: layout(title='Group Detail', content=~{::#content})}">
    <div id="content">
        <p th:if="${error}" th:text="${error}" role="alert">Error</p>

        <dl>
            <dt>Topic</dt>
            <dd th:text="${detail.topicName}">Topic</dd>
            <dt>Status</dt>
            <dd th:text="${detail.group.status}">Status</dd>
        </dl>

        <h2>Current Members</h2>
        <table>
            <thead>
            <tr>
                <th>Participant</th>
                <th>Joined</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${detail.currentMembers}">
                <td th:text="${m.participantDisplayName}">Name</td>
                <td th:text="${m.joinedAt}">Joined</td>
                <td>
                    <form th:if="${detail.group.status.name()} == 'ACTIVE'"
                          th:action="@{/organiser/groups/{id}/members/{pid}/remove(id=${detail.group.id}, pid=${m.participantId})}"
                          method="post">
                        <button type="submit">Remove</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${detail.currentMembers.isEmpty()}">
                <td colspan="3">None</td>
            </tr>
            </tbody>
        </table>

        <h2>Former Members</h2>
        <table>
            <thead>
            <tr>
                <th>Participant</th>
                <th>Joined</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${detail.formerMembers}">
                <td th:text="${m.participantDisplayName}">Name</td>
                <td th:text="${m.joinedAt}">Joined</td>
            </tr>
            <tr th:if="${detail.formerMembers.isEmpty()}">
                <td colspan="2">None</td>
            </tr>
            </tbody>
        </table>

        <div th:if="${detail.group.status.name()} == 'ACTIVE'">
            <h2>Add Member</h2>
            <form th:action="@{/organiser/groups/{id}/members(id=${detail.group.id})}" method="post">
                <select name="participant_id" required="required">
                    <option th:each="p : ${allParticipants}" th:value="${p.id}" th:text="${p.displayName}">
                        Name
                    </option>
                </select>
                <button type="submit">Add</button>
            </form>

            <h2>Disband</h2>
            <form th:action="@{/organiser/groups/{id}/disband(id=${detail.group.id})}" method="post">
                <button type="submit">Disband</button>
            </form>
        </div>
    </div>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/* The shared audit-entries table (contracts/audit-retrieval.md, FR-011, FR-011a): timestamp,
     event type, actor display name, capacity, and the old -> new value pair when present, most-
     recent-first (the caller's `entries` is already ordered that way). An empty `entries` renders
     a clearly-labeled empty state rather than an empty table. */-->
<body>
<th:block th:fragment="table(entries)">
    <table th:if="${!#lists.isEmpty(entries)}">
        <thead>
        <tr>
            <th>Timestamp</th>
            <th>Event</th>
            <th>Actor</th>
            <th>Capacity</th>
            <th>Change</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${entries}">
            <td th:text="${entry.occurredAt}">Timestamp</td>
            <td th:text="${entry.eventType}">Event</td>
            <td th:text="${entry.actorDisplayName}">Actor</td>
            <td th:text="${entry.organiser} ? 'Organiser' : 'Standard User'">Capacity</td>
            <td th:if="${entry.oldValue} != null or ${entry.newValue} != null"
                th:text="${entry.oldValue} + ' -> ' + ${entry.newValue}">Old -> New</td>
            <td th:unless="${entry.oldValue} != null or ${entry.newValue} != null"></td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(entries)}">No changes recorded yet.</p>
</th:block>
</body>
</html>

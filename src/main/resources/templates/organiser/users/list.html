<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{organiser/fragments/layout :: head(title='Users')}">
    <title>Users</title>
</head>
<body>
<th:block th:replace="~{organiser/fragments/layout :: layout(title='Users', content=~{::#content})}">
    <div id="content">
        <table>
            <thead>
            <tr>
                <th>Display Name</th>
                <th>Email</th>
                <th>Organiser</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.displayName}">Name</td>
                <td th:text="${user.email}">Email</td>
                <td>
                    <span th:if="${user.organiser}" class="badge-success"><svg th:replace="~{fragments/icons :: checkCircle(null)}"/> Yes</span>
                    <span th:unless="${user.organiser}" class="badge-danger"><svg th:replace="~{fragments/icons :: xCircle(null)}"/> No</span>
                </td>
                <td class="actions"><a th:href="@{/organiser/users/{id}(id=${user.id})}" role="button" class="outline secondary">View</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</body>
</html>

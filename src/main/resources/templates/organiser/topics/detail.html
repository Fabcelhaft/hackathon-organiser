<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/* The Topic's name is the <h1> the layout renders, so it is not repeated as a <dl> row. */-->
<head th:replace="~{organiser/fragments/layout :: head(title=${detail.topic.name})}">
    <title>Topic Detail</title>
</head>
<body>
<th:block th:replace="~{organiser/fragments/layout :: layout(title=${detail.topic.name}, content=~{::#content})}">
    <div id="content">
        <p th:if="${error}" th:text="${error}" role="alert" class="error-message">Error</p>

        <!--/* Feature 010 FR-001a: markdown description rendered full-width under the heading,
             replacing the plain-text Description row that used to open this <dl>. th:utext is
             deliberate — descriptionHtml is pre-sanitized by MarkdownRenderer. */-->
        <section class="topic-description" th:utext="${descriptionHtml}">Description</section>

        <dl>
            <dt>Creator</dt>
            <dd><span th:replace="~{fragments/teams-link :: displayName(${detail.creatorDisplayName}, ${teamsLinksEnabled ? detail.creatorEmail : null})}"></span></dd>
            <dt>Approval Status</dt>
            <dd>
                <span class="actions">
                    <span th:if="${detail.topic.approvalStatus.name()} == 'PENDING'" class="badge badge-pending">Pending approval</span>
                    <span th:if="${detail.topic.approvalStatus.name()} == 'APPROVED'">Approved</span>
                    <form th:if="${detail.topic.approvalStatus.name()} == 'PENDING'"
                          th:action="@{/organiser/topics/{id}/approve(id=${detail.topic.id})}" method="post">
                        <button type="submit" class="outline secondary">Approve</button>
                    </form>
                </span>
            </dd>
            <dt>Skills</dt>
            <dd>
                <span th:each="skill : ${detail.skills}" th:text="${skill.name} + ' '">Skill</span>
                <span th:if="${detail.skills.isEmpty()}">None</span>
            </dd>
            <dt>Active Group</dt>
            <dd>
                <a th:if="${activeGroupId} != null"
                   th:href="@{/organiser/groups/{id}(id=${activeGroupId})}">Active &mdash; View Group</a>
                <span th:if="${activeGroupId} == null">No active group</span>
            </dd>
        </dl>

        <!--/* Feature 010 FR-018: same Attachments listing as the participant-facing detail view,
             using the same download route — attachment visibility follows Topic visibility, and an
             Organiser can see every Topic. */-->
        <h2>Attachments</h2>
        <p th:if="${attachments == null or attachments.isEmpty()}">No attachments yet.</p>
        <!--/* No <caption> here: the <h2> immediately above already names this
             table, and repeating the word twice reads as a duplicated heading. */-->
        <table th:unless="${attachments == null or attachments.isEmpty()}">
            <thead>
            <tr>
                <th scope="col">File</th>
                <th scope="col">Size</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="attachment : ${attachments}">
                <td>
                    <a th:href="@{/topics/{tid}/attachments/{aid}(tid=${attachment.topicId()},aid=${attachment.id()})}"
                       th:text="${attachment.fileName()}">file.pdf</a>
                </td>
                <td th:text="${attachment.humanSize()}">1.2 MB</td>
            </tr>
            </tbody>
        </table>

        <div class="actions">
            <a th:href="@{/organiser/topics/{id}/edit(id=${detail.topic.id})}" role="button">Edit</a>
            <a th:href="@{/organiser/topics/{id}/audit(id=${detail.topic.id})}" role="button" class="outline secondary">Audit</a>
        </div>
    </div>
</th:block>
</body>
</html>

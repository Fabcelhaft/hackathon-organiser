<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{organiser/fragments/layout :: head(title='Topic')}">
    <title>Topic</title>
</head>
<body>
<th:block th:replace="~{organiser/fragments/layout :: layout(title='Topic', content=~{::#content})}">
    <div id="content">
        <p th:if="${error}" th:text="${error}" role="alert">Error</p>
        <form th:action="${topicId} != null ? @{/organiser/topics/{id}(id=${topicId})} : @{/organiser/topics}"
              method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" th:value="${name}" required="required"/>

            <label for="description">Description</label>
            <textarea id="description" name="description" required="required" th:text="${description}"></textarea>

            <!-- The creator is set once, at creation, and is never re-assignable afterward
                 (FR-015) — this field only ever appears on the new-Topic form. -->
            <div th:if="${topicId} == null">
                <label for="created_by_user_id">Creator</label>
                <select id="created_by_user_id" name="created_by_user_id" required="required">
                    <option th:each="user : ${availableUsers}" th:value="${user.id}" th:text="${user.displayName}">
                        Name
                    </option>
                </select>
            </div>

            <fieldset>
                <legend>Skills</legend>
                <div th:each="skill : ${allSkills}">
                    <label>
                        <input type="checkbox" name="skill_ids" th:value="${skill.id}"
                               th:checked="${#lists.contains(selectedSkillIds, skill.id)}"/>
                        <span th:text="${skill.name}">Skill</span>
                    </label>
                </div>
            </fieldset>

            <button type="submit">Save</button>
        </form>
    </div>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{organiser/fragments/layout :: head(title='Topics')}">
    <title>Topics</title>
</head>
<body>
<th:block th:replace="~{organiser/fragments/layout :: layout(title='Topics', content=~{::#content})}">
    <div id="content">
        <p th:if="${error}" th:text="${error}" role="alert" class="error-message">Error</p>
        <div class="actions"><a th:href="@{/organiser/topics/new}" role="button">New Topic</a></div>
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Status</th>
                <th>Active Group</th>
                <th>Compliance</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${topics}">
                <td th:text="${row.topic.name}">Name</td>
                <td>
                    <span th:if="${row.topic.approvalStatus.name()} == 'PENDING'" class="badge badge-pending">Pending approval</span>
                    <span th:if="${row.topic.approvalStatus.name()} == 'APPROVED'">Approved</span>
                </td>
                <td>
                    <a th:if="${row.activeGroupId} != null"
                       th:href="@{/organiser/groups/{id}(id=${row.activeGroupId})}">Active</a>
                    <span th:if="${row.activeGroupId} == null">No active group</span>
                </td>
                <td>
                    <!--/* FR-025: text/icon, never color alone. */-->
                    <span th:if="${row.complianceStatus().isEmpty()}">
                        <svg th:replace="~{fragments/icons :: circleHelp(null)}"/> No Group Yet
                    </span>
                    <span th:if="${row.complianceStatus().isPresent()} and ${row.complianceStatus().get().name()} == 'COMPLIANT'" class="badge-success">
                        <svg th:replace="~{fragments/icons :: checkCircle(null)}"/> Compliant
                    </span>
                    <span th:if="${row.complianceStatus().isPresent()} and ${row.complianceStatus().get().name()} == 'NOT_COMPLIANT'" class="badge-danger">
                        <svg th:replace="~{fragments/icons :: xCircle(null)}"/> Not Compliant
                    </span>
                    <span th:if="${row.complianceStatus().isPresent()} and ${row.complianceStatus().get().name()} == 'COMPLIANT_OVERRIDE'" class="badge-success">
                        <svg th:replace="~{fragments/icons :: checkCircle(null)}"/> Compliant (Organiser Override)
                    </span>
                </td>
                <td class="actions"><a th:href="@{/organiser/topics/{id}(id=${row.topic.id})}" role="button" class="outline secondary">View</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{organiser/fragments/layout :: head(title='Custom Fields')}">
    <title>Custom Fields</title>
</head>
<body>
<th:block th:replace="~{organiser/fragments/layout :: layout(title='Custom Fields', content=~{::#content})}">
    <div id="content">
        <p th:if="${error}" th:text="${error}" role="alert" class="error-message">Error</p>
        <div class="actions"><a th:href="@{/organiser/custom-fields/new}" role="button">New Custom Field</a></div>
        <table>
            <thead>
            <tr>
                <th>Label</th>
                <th>Type</th>
                <th>Required</th>
                <th>Public</th>
                <th>Overview</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="field : ${customFields}">
                <td th:text="${field.label}">Label</td>
                <td th:text="${field.fieldType}">Type</td>
                <td th:text="${field.required} ? 'Yes' : 'No'">Required</td>
                <td th:text="${field.public_} ? 'Yes' : 'No'">Public</td>
                <td th:text="${field.overview} ? 'Yes' : 'No'">Overview</td>
                <!--/* The COUNTRY field is enabled/disabled rather than deleted — it is catalog-backed,
                     so the destructive variant is deliberately absent from that branch. */-->
                <td class="actions" th:if="${field.fieldType.name()} == 'COUNTRY'">
                    <span th:text="${field.enabled} ? 'Enabled' : 'Disabled'">Enabled</span>
                    <a th:href="@{/organiser/custom-fields/{id}/edit(id=${field.id})}" role="button"
                       class="outline secondary">Edit</a>
                    <form th:if="${field.enabled}"
                          th:action="@{/organiser/custom-fields/{id}/country/disable(id=${field.id})}" method="post">
                        <button type="submit" class="outline secondary">Disable</button>
                    </form>
                    <form th:unless="${field.enabled}"
                          th:action="@{/organiser/custom-fields/{id}/country/enable(id=${field.id})}" method="post">
                        <button type="submit" class="outline secondary">Enable</button>
                    </form>
                </td>
                <td class="actions" th:unless="${field.fieldType.name()} == 'COUNTRY'">
                    <a th:href="@{/organiser/custom-fields/{id}/edit(id=${field.id})}" role="button"
                       class="outline secondary">Edit</a>
                    <form th:action="@{/organiser/custom-fields/{id}/delete(id=${field.id})}" method="post">
                        <button type="submit" class="outline danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>
</body>
</html>

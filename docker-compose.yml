services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://db:5432/hackathon
      SPRING_R2DBC_USERNAME: hackathon
      SPRING_R2DBC_PASSWORD: hackathon
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    # Published so that a `mvn spring-boot:run` outside the compose network — notably from the
    # dev container, which uses docker-outside-of-docker and therefore sits on a different
    # bridge — can reach the database, and so DB client tooling can connect.
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: hackathon
    volumes:
      # postgres:18+ images store data in a major-version subdirectory and require the mount at
      # /var/lib/postgresql (not .../data) — mounting the old path aborts startup.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon -d hackathon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
